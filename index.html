<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minecraft RTS</title>
  <style>
    :root {
      --bg: #1d2b2f;
      --panel: #2d4047;
      --panel-2: #1a2a2e;
      --accent: #f4d35e;
      --text: #edf2f4;
      --muted: #b9c9ce;
      --grass1: #7ecb7a;
      --grass2: #6db66d;
      --water: #66c5ea;
      --tree: #24663a;
      --wood: #8b5a2b;
      --rock: #7b7b7b;
      --gold: #d4af37;
      --enemy: #d65b5b;
      --selection: #7ef29a;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    #app {
      display: flex;
      width: 100vw;
      height: 100vh;
    }

    canvas {
      flex: 1;
      display: block;
      background: linear-gradient(#9cd9ff, #dff5ff);
      border-right: 2px solid #21333a;
      cursor: crosshair;
    }

    .sidebar {
      width: 320px;
      padding: 12px;
      background: var(--panel);
      border-left: 2px solid #21333a;
      overflow-y: auto;
    }

    .panel {
      background: var(--panel-2);
      border: 1px solid #3a4f58;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }

    h3 {
      margin: 0 0 10px;
      font-size: 13px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--accent);
    }

    .age-box {
      text-align: center;
      font-weight: bold;
      font-size: 18px;
      padding: 12px;
      border-radius: 7px;
      background: rgba(244, 211, 94, 0.1);
      border: 1px solid rgba(244, 211, 94, 0.4);
      color: var(--accent);
    }

    .resource {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 8px 0;
      padding: 7px 9px;
      background: rgba(255,255,255,0.03);
      border-radius: 6px;
      font-size: 14px;
    }

    button {
      width: 100%;
      background: #495f68;
      color: var(--text);
      border: 1px solid #5e7380;
      border-radius: 6px;
      padding: 9px 10px;
      margin: 6px 0;
      font-size: 13px;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    button:hover {
      background: #58707d;
      transform: translateY(-1px);
    }

    .selected-box {
      min-height: 120px;
      font-size: 13px;
      color: var(--muted);
    }

    .list-item {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 6px;
      padding: 7px 8px;
      margin: 6px 0;
    }

    .mini {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="gameCanvas" width="1100" height="740"></canvas>

    <aside class="sidebar">
      <div class="panel">
        <div id="ageLabel" class="age-box">Età del Legno</div>
        <div style="margin-top:10px;">
          <button id="advanceAgeBtn">Avanza Età (500 oro)</button>
        </div>
      </div>

      <div class="panel">
        <h3>Risorse</h3>
        <div class="resource"><span>🌲 Legno</span><strong id="woodValue">100</strong></div>
        <div class="resource"><span>🪨 Pietra</span><strong id="stoneValue">50</strong></div>
        <div class="resource"><span>🌾 Cibo</span><strong id="foodValue">75</strong></div>
        <div class="resource"><span>🪙 Oro</span><strong id="goldValue">0</strong></div>
      </div>

      <div class="panel">
        <h3>Edifici</h3>
        <button data-build="townhall">🏠 Municipio (100 legno, 100 pietra)</button>
        <button data-build="farm">🌾 Fattoria (50 legno)</button>
        <button data-build="barracks">🛡 Caserma (200 legno, 100 pietra)</button>
        <button data-build="tower">🗼 Torre (150 legno, 150 pietra)</button>
        <button data-build="market">🏪 Mercato (100 legno, 50 pietra)</button>
      </div>

      <div class="panel">
        <h3>Unità</h3>
        <button id="trainVillagerBtn">🧑 Villico (25 cibo)</button>
        <button id="trainWarriorBtn">⚔ Guerriero (60 cibo, 20 oro)</button>
        <button id="trainArcherBtn">🏹 Arciere (45 cibo, 30 oro)</button>
      </div>

      <div class="panel">
        <h3>Selezione</h3>
        <div id="selectionInfo" class="selected-box">Nessuna unità selezionata.</div>
      </div>

      <div class="panel mini">
        <span>Popolazione</span>
        <strong id="populationValue">0</strong>
      </div>
    </aside>
  </div>

  <script src="game.js"></script>
</body>
</html>
